<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Libations</title>

<style>
body {
  margin: 0;
  padding: 50px 20px;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

/* ✅ SMALLER LOGO */
.logo {
  max-width: 260px;
  margin-bottom: 60px;
}
.logo img {
  width: 100%;
}

/* layout */
.video-wrapper {
  width: 100%;
  max-width: 800px;
  margin-bottom: 80px;
}

.video-container {
  position: relative;
  width: 100%;
  padding-top: 75%;
  overflow: hidden;
  background: #000;
}

#DominiqueJackson_Bg {
  background-image: url("DominiqueJackson.png");
  background-repeat: no-repeat;
  background-size: 140%;
  background-position: center 25%;
}

/* SD Video Background */
#SD_Bg {
  background: url("GoodLibationsIntro.png") center / cover no-repeat;
}

/* Josh Leos Background */
.video-poster {
  position: absolute;
  inset: 0;
  background: url("JoshLeos.png") center / cover no-repeat;
  z-index: 2;
}

.stream-wrapper {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 1;
}

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

/* overlay */
.video-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 3;
}

.lock-icon {
  font-size: 0.8rem;
  margin-bottom: 8px;
  letter-spacing: 1px;
  font-weight: bold;
}

.password-box input {
  padding: 6px;
  width: 130px;
  font-size: 0.75rem;
  border-radius: 4px;
  border: 2px solid #fff;
  background: transparent;
  color: #fff;
  text-align: center;
}

/* ✅ INSTAGRAM (no extra gap now) */
.social-icon {
  margin-bottom: 0;
}
.social-icon img {
  height: 50px;
  transition: transform 0.2s ease;
}
.social-icon img:hover {
  transform: scale(1.1);
}

/* ✅ FOOTER tighter */
footer {
  margin-top: auto;
  font-size: 0.9rem;
  padding: 10px 0;
}
</style>
</head>

<body>

<!--  Good Libes LOGO -->
<div class="logo">
  <img src="new%20goodlibes%20logo.png" alt="Good Libations Logo">
</div>

<!-- Dominique Jackson's Video -->
<div class="video-wrapper">
  <div class="video-container" id="DominiqueJackson_Bg">

    <div class="stream-wrapper" id="stream3">
      <iframe src="https://player.mediadelivery.net/embed/658521/d0a00f04-16f8-4ab6-93ef-c816d9de7e26?responsive=true&autoplay=false"
        allow="accelerometer; gyroscope; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="video-overlay" id="overlay3">
      <div class="lock-icon">ENTER PASSWORD</div>
      <div class="password-box">
        <input type="password" id="pass3" placeholder="Password">
      </div>
    </div>

  </div>
</div>

<!-- SD Video -->
<div class="video-wrapper">
  <div class="video-container" id="SD_Bg">

    <div class="stream-wrapper" id="stream2">
      <iframe src="https://player.mediadelivery.net/play/658521/2fb2db85-2249-4900-9617-d16750c9b328?responsive=true&autoplay=false"
        allow="accelerometer; gyroscope; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="video-overlay" id="overlay2">
      <div class="lock-icon">ENTER PASSWORD</div>
      <div class="password-box">
        <input type="password" id="pass2" placeholder="Password">
      </div>
    </div>

  </div>
</div>

<!-- Josh Leos Video -->
<div class="video-wrapper">
  <div class="video-container">

    <div class="video-poster" id="poster"></div>

    <div class="stream-wrapper" id="stream">
      <iframe src="https://player.mediadelivery.net/embed/658521/41f6d25c-2fb5-4d05-8d15-8bf411f450f5?responsive=true&autoplay=false"
        allow="accelerometer; gyroscope; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="video-overlay" id="overlay">
      <div class="lock-icon">ENTER PASSWORD</div>
      <div class="password-box">
        <input type="password" id="pass" placeholder="Password">
      </div>
    </div>

  </div>
</div>

<!-- Instagram Link -->
<div class="social-icon">
  <a href="https://instagram.com/goodlibes?igsh=NTc4MTlwNjQ2YQ==" target="_blank">
    <img src="IG.avif" alt="Instagram">
  </a>
</div>

<!-- FOOTER -->
<footer>
  © 2026 Good Libations — All Rights Reserved
</footer>

<script>
async function hashPassword(password) {
  const data = new TextEncoder().encode(password);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

/* Dominique Jackson PASSWORD */
const DominiqueJackson_PASSWORD = "fiftyfiftymartini";
let correctHash3 = "";

(async () => {
  correctHash3 = await hashPassword(DominiqueJackson_PASSWORD);
})();

document.getElementById("pass3").addEventListener("input", async (e) => {
  const hashed = await hashPassword(e.target.value.trim());

  if (hashed === correctHash3) {
    document.getElementById("overlay3").style.display = "none";
    document.getElementById("stream3").style.display = "block";
  }
});

/* SD Video PASSWORD */
const REAL_PASSWORD = "parkingtickets";
let correctHash2 = "";

(async () => {
  correctHash2 = await hashPassword(REAL_PASSWORD);
})();

document.getElementById("pass2").addEventListener("input", async (e) => {
  const hashed = await hashPassword(e.target.value.trim());
  if (hashed === correctHash2) {
    document.getElementById("overlay2").style.display = "none";
    document.getElementById("stream2").style.display = "block";
  }
});

/* Josh Leos Video PASSWORD */
const correctHash = "9d366d854d74392bd934c6ce88c94c415017758c31d29f624e2c8a9bea686d17";

document.getElementById("pass").addEventListener("input", async (e) => {
  const hashed = await hashPassword(e.target.value.trim());
  if (hashed === correctHash) {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("poster").style.display = "none";
    document.getElementById("stream").style.display = "block";
  }
});
</script>

</body>
</html>
